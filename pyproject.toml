[project]
name = "dp-lookup-pro"
version = "3.10.1"
description = "MCGM SDP 2014-34 DP Lookup Tool with PDF Reports, HD Maps, Satellite Aerial Views, GIS CAD Exports, and High-Speed Async Batching"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "httpx[http2]>=0.28.0",
    # ImageDraw.text(font_size=...) is used for the map legend and north arrow.
    # That keyword arrived in Pillow 10.1.0, so 10.0.x would crash at render time.
    "pillow>=10.1.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0",
    "qrcode>=7.4.0",
    "ezdxf>=1.4.2",
    "shapely>=2.0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "matplotlib>=3.8.0"]  # matplotlib powers tools/render_dxf.py

[project.scripts]
dp-lookup-pro = "cts_dp_lookup_pro:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["cts_dp_lookup_pro.py"]

[tool.hatch.build.targets.sdist]
include = ["cts_dp_lookup_pro.py", "README.md", "START-HERE.md", "LICENSE", "tests"]

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = [".venv", "output", "docs"]

[tool.ruff.lint]
# Chosen for defects, not style. Deliberately excluded:
#   UP/FA  - Dict->dict modernisation and __future__ annotations. Pure churn
#            across 17 sites with no behaviour change, and the project still
#            declares support back to 3.9.
#   DTZ    - naive datetimes. These are local report timestamps shown to a
#            human in one city; timezone-aware would add noise, not safety.
#   S110   - try/except/pass. Several are deliberate (optional ezdxf linetypes);
#            reviewed by hand rather than gated in CI.
select = ["E", "F", "I", "B", "RUF"]
# E501 is deferred, not dismissed: 13 long lines are ArcGIS request payloads whose
# exact params are validated against the live server. Hand-wrapping them now risks
# a typo in a working request for no behaviour gain; they get restructured when
# lookup_plot_pro (730 lines) is split.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]
