[project]
name = "dp-lookup-pro"
version = "3.14.0"
description = "MCGM SDP 2014-34 DP Lookup Tool with PDF Reports, HD Maps, Satellite Aerial Views, GIS CAD Exports, and High-Speed Async Batching"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.28.0",
    # ImageDraw.text(font_size=...) is used for the map legend and north arrow.
    # That keyword arrived in Pillow 10.1.0, so 10.0.x would crash at render time.
    "pillow>=10.1.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0",
    "qrcode>=7.4.0",
    "ezdxf>=1.4.2",
    "shapely>=2.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "matplotlib>=3.8.0",  # matplotlib powers tools/render_dxf.py
    "mypy>=1.13.0,<1.18.0",
    "pip-audit>=2.7.3",
    "pytest-cov>=6.0.0",
]

[project.scripts]
dp-lookup-pro = "dp_lookup.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["cts_dp_lookup_pro.py", "dp_lookup"]

[tool.hatch.build.targets.sdist]
include = [
    "cts_dp_lookup_pro.py",
    "dp_lookup",
    "dp-lookup-pro",
    "README.md",
    "START-HERE.md",
    "CONTRIBUTING.md",
    "SKILL.md",
    "LICENSE",
    "docs",
    "tests",
    "tools",
]

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = [".venv", "output", "docs"]

[tool.ruff.lint]
# Chosen for defects, not style. Deliberately excluded:
#   UP/FA  - Dict->dict modernisation and __future__ annotations. Pure churn
#            across 17 sites with no behaviour change, and the project still
#            declares support back to 3.9.
#   DTZ    - naive datetimes. These are local report timestamps shown to a
#            human in one city; timezone-aware would add noise, not safety.
#   S110   - try/except/pass. Several are deliberate (optional ezdxf linetypes);
#            reviewed by hand rather than gated in CI.
select = ["E", "F", "I", "B", "RUF"]
# E501 remains disabled for a small number of generated-markup, ArcGIS schema,
# and drawing-declaration lines where wrapping would reduce readability.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ezdxf 1.4.2 is the last Python 3.9-compatible release and still calls
# pyparsing's compatibility aliases. Keep project/runtime warnings visible
# while suppressing only that upstream deprecation class on the oldest matrix.
filterwarnings = ["ignore::pyparsing.exceptions.PyparsingDeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["dp_lookup"]

[tool.coverage.report]
fail_under = 83
show_missing = true
skip_covered = true

[tool.mypy]
# Strict checking covers the complete production package. Third-party modules
# without inline typing are ignored explicitly below; project code is not.
python_version = "3.9"
strict = true
# The selected modules are checked strictly; avoid recursively turning the
# package's legacy facade and third-party rendering stack into this boundary.
follow_imports = "skip"
files = ["dp_lookup"]

[[tool.mypy.overrides]]
module = [
    "ezdxf.*",
    "openpyxl.*",
    "qrcode.*",
    "reportlab.*",
    "shapely.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "mypy>=1.13.0,<1.18.0",
    "pip-audit>=2.7.3",
    "pytest-cov>=6.0.0",
]
