[project]
name = "dp-lookup-pro"
version = "3.14.0"
description = "MCGM SDP 2014-34 DP Lookup Tool with PDF Reports, HD Maps, Satellite Aerial Views, GIS CAD Exports, and High-Speed Async Batching"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.28.0",
    "pillow>=13.0.0",
    "certifi>=2026.10.19",
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0",
    "qrcode>=7.4.0",
    "ezdxf>=1.4.2",
    "shapely>=2.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "matplotlib>=3.11.2",
    "mypy>=2.4.0,<3",
    "pip-audit>=2.10.1",
    "pytest-cov>=7.1.0",
]

[project.scripts]
dp-lookup-pro = "dp_lookup.cli:main"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["dp_lookup"]

[tool.hatch.build.targets.sdist]
include = [
    "dp_lookup",
    "dp-lookup-pro",
    "README.md",
    "START-HERE.md",
    "CONTRIBUTING.md",
    "SKILL.md",
    "LICENSE",
    "docs",
    "tests",
    "tools",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "output", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "RUF", "UP", "SIM", "PIE", "FURB"]
ignore = ["E501", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::pyparsing.exceptions.PyparsingDeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["dp_lookup"]

[tool.coverage.report]
fail_under = 83
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports = "skip"
files = ["dp_lookup"]

[[tool.mypy.overrides]]
module = [
    "ezdxf.*",
    "openpyxl.*",
    "qrcode.*",
    "reportlab.*",
    "shapely.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "ruff>=0.17.2",
    "mypy>=2.4.0,<3",
    "pip-audit>=2.10.1",
    "pytest-cov>=7.1.0",
]
