name: Trusted release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: build, attest, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.12.1"
      - run: uv lock --check
      - run: uv python install 3.13
      - name: Verify tag matches project version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tag_version="${RELEASE_TAG#v}"
          project_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -n 1)"
          test -n "$project_version"
          test "$tag_version" = "$project_version"
      - name: Build distributions
        run: uv build
      - name: Smoke-test wheel and source distribution in isolation
        run: |
          wheel=$(echo dist/*.whl)
          sdist=$(echo dist/*.tar.gz)
          uv run --isolated --no-project --with "$wheel" dp-lookup-pro --help
          uv run --isolated --no-project --with "$sdist" dp-lookup-pro --help
      - name: Write release checksums
        run: sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS
      - name: Attest wheel provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/*.whl
      - name: Attest source distribution provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - name: Publish through PyPI trusted publishing
        run: uv publish
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
