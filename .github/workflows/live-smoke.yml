name: Live ArcGIS smoke

on:
  schedule:
    - cron: "17 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-arcgis
  cancel-in-progress: true

jobs:
  smoke:
    name: uncached WORLI acceptance lookup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          version: "0.12.1"
      - run: uv lock --check
      - run: uv python install 3.14
      - run: uv sync --frozen --no-dev --python 3.14
      - name: Run uncached lookup and validate every artifact
        env:
          LIVE_SMOKE_ROOT: ${{ runner.temp }}/dp-lookup-live-smoke
          LIVE_SMOKE_SUMMARY: ${{ runner.temp }}/dp-lookup-live-smoke-summary.json
        run: |
          uv run --frozen python - <<'PY'
          import asyncio
          import json
          import os
          import time
          import xml.etree.ElementTree as ET
          from pathlib import Path

          from PIL import Image
          import ezdxf
          from openpyxl import load_workbook

          from dp_lookup.application.lookup_service import lookup_plot_pro

          output_dir = Path(os.environ["LIVE_SMOKE_ROOT"])
          summary_path = Path(os.environ["LIVE_SMOKE_SUMMARY"])
          output_dir.mkdir(parents=True, exist_ok=True)

          async def run():
              result = None
              attempts = []
              for attempt in range(1, 3):
                  started = time.perf_counter()
                  result = await lookup_plot_pro(
                      "WORLI", "733", output_dir=str(output_dir), use_cache=False
                  )
                  attempts.append({
                      "attempt": attempt,
                      "elapsed_seconds": round(time.perf_counter() - started, 3),
                      "error": result.get("error"),
                  })
                  if "error" not in result and result.get("metadata", {}).get("complete"):
                      break
                  if attempt < 2:
                      await asyncio.sleep(20)

              if result is None or "error" in result:
                  error = "lookup returned no result" if result is None else str(result.get("error"))
                  network_markers = (
                      "ConnectTimeout",
                      "ConnectError",
                      "ReadTimeout",
                      "PoolTimeout",
                  )
                  if any(marker in error for marker in network_markers):
                      summary = {
                          "outcome": "upstream_unreachable",
                          "error": error,
                          "attempts": attempts,
                      }
                      summary_path.write_text(json.dumps(summary, indent=2), encoding="utf-8")
                      print(f"::warning title=MCGM ArcGIS unreachable::{error}")
                      return
                  raise RuntimeError(f"live lookup failed: {result}")
              if not result.get("metadata", {}).get("complete"):
                  raise RuntimeError(f"live lookup incomplete: {result.get('metadata')}")

              identity = result["plot_identity"]
              assert identity["village"] == "WORLI", identity
              assert identity["cts_no"] == "733", identity
              assert identity["ward"] == "G/S", identity

              files = result["export_files"]
              required = (
                  "pdf_report", "hd_dp_map", "satellite_view", "autocad_dxf",
                  "autocad_geojson", "google_earth_kml", "interactive_html_map",
                  "master_excel_register",
              )
              checks = {}
              for key in required:
                  path = Path(files[key])
                  assert path.is_file() and path.stat().st_size > 0, (key, path)
                  suffix = path.suffix.lower()
                  if suffix == ".png":
                      with Image.open(path) as image:
                          image.verify()
                  elif suffix == ".dxf":
                      ezdxf.readfile(str(path))
                  elif suffix == ".xlsx":
                      workbook = load_workbook(path, read_only=True, data_only=True)
                      assert workbook.sheetnames
                      workbook.close()
                  elif suffix == ".kml":
                      ET.parse(path)
                  elif suffix == ".geojson":
                      json.loads(path.read_text(encoding="utf-8"))
                  elif suffix == ".pdf":
                      assert path.read_bytes()[:5] == b"%PDF-"
                  elif suffix == ".html":
                      assert len(path.read_text(encoding="utf-8")) > 100
                  checks[key] = {"path": str(path), "size": path.stat().st_size}

              summary = {
                  "outcome": "passed",
                  "attempts": attempts,
                  "identity": identity,
                  "metadata": result["metadata"],
                  "status": result["planning_remarks"]["status_badge"],
                  "crz": result["regulatory_and_infrastructure"]["crz_status"],
                  "metro": result["regulatory_and_infrastructure"]["metro_buffer"],
                  "neighbour_count": result["spatial_cluster"]["adjoining_plots_count"],
                  "artifact_checks": checks,
              }
              summary_path.write_text(json.dumps(summary, indent=2), encoding="utf-8")

          asyncio.run(run())
          PY
      - name: Upload smoke summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-arcgis-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/dp-lookup-live-smoke-summary.json
          if-no-files-found: error
          retention-days: 7
