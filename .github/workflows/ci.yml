name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "0.13.9"
      - run: uv lock --check
      - run: uv sync --frozen --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python tools/check_comments.py
      - run: uv run python -m compileall -q dp_lookup tests

  quality:
    name: typing, tests, coverage, dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "0.13.9"
      - run: uv python install 3.15
      - run: uv lock --check
      - run: uv sync --frozen --all-extras --dev --python 3.15
      - name: Check the complete production package with strict typing
        run: uv run --python 3.15 mypy
      - name: Enforce branch-aware coverage ratchet
        run: uv run --python 3.15 pytest -q --cov --cov-report=term-missing --cov-report=xml
      - name: Verify the CLI help and version
        run: |
          uv run --python 3.15 dp-lookup-pro --help | grep -q "Usage:"
          uv run --python 3.15 dp-lookup-pro --version | grep -q "3.14.0"
      - name: Verify the village list is intact
        run: |
          uv run --python 3.15 python dp-lookup-pro --list-villages \
            | grep -q "128 valid MCGM village names"
      - name: Audit locked runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes --format requirements-txt --output-file "$RUNNER_TEMP/runtime-requirements.txt" -q
          uv run --python 3.15 pip-audit --cache-dir "$RUNNER_TEMP/pip-audit-cache" -r "$RUNNER_TEMP/runtime-requirements.txt"
      - name: Retain coverage evidence
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  build:
    name: clean build/install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "0.13.9"
      - run: uv lock --check
      - run: uv sync --frozen --all-extras --dev
      - name: Build distributions
        run: uv build
      - name: Verify wheel contents
        run: uv run pytest -q -rs tests/test_typing_contract.py
      - name: Install the wheel into a clean environment
        run: |
          uv python install 3.15
          uv venv --python 3.15 "$RUNNER_TEMP/dp-lookup-clean-venv"
          uv pip install --python "$RUNNER_TEMP/dp-lookup-clean-venv/bin/python" dist/*.whl
          "$RUNNER_TEMP/dp-lookup-clean-venv/bin/dp-lookup-pro" --help
          "$RUNNER_TEMP/dp-lookup-clean-venv/bin/dp-lookup-pro" --version
          "$RUNNER_TEMP/dp-lookup-clean-venv/bin/python" -c "import dp_lookup; from dp_lookup.application.lookup_service import lookup_plot_pro; assert dp_lookup.lookup_plot_pro is lookup_plot_pro; assert dp_lookup.__version__ == '3.14.0'"
      - name: Retain distributions for this run
        uses: actions/upload-artifact@v7
        with:
          name: dp-lookup-dist-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
