name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel an in-flight run when the branch is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          version: "0.13.5"
      - run: uv lock --check
      - run: uv sync --frozen --all-extras --dev
      - run: uv run ruff check .
      - run: uv run python tools/check_format.py
      - run: uv run python -m compileall -q cts_dp_lookup_pro.py dp_lookup tests

  quality:
    name: typing, coverage, dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          version: "0.13.5"
      - run: uv python install 3.15
      - run: uv lock --check
      - run: uv sync --frozen --all-extras --dev --python 3.15
      - name: Check the complete production package with strict typing
        run: uv run --python 3.15 mypy
      - name: Enforce branch-aware coverage ratchet
        run: uv run --python 3.15 pytest -q --cov --cov-report=term-missing --cov-report=xml
      - name: Audit locked runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes --format requirements-txt --output-file "$RUNNER_TEMP/runtime-requirements.txt" -q
          uv run --python 3.15 pip-audit --cache-dir "$RUNNER_TEMP/pip-audit-cache" -r "$RUNNER_TEMP/runtime-requirements.txt"
      - name: Retain coverage evidence
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  build:
    name: clean build/install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          version: "0.13.5"
      - run: uv lock --check
      - run: uv sync --frozen --all-extras --dev
      - name: Build distributions
        run: uv build
      - name: Verify wheel module contents
        run: >-
          python -c "import glob,zipfile;
          p=glob.glob('dist/*.whl')[0];
          n=set(zipfile.ZipFile(p).namelist());
          required={'dp_lookup/application/lookup_service.py','dp_lookup/application/dependencies.py','dp_lookup/application/exporting.py','dp_lookup/application/authority_resolver.py','dp_lookup/authority/models.py','dp_lookup/authority/store.py','dp_lookup/authority/selection.py','dp_lookup/authority_cli.py','dp_lookup/clients/transport.py','dp_lookup/clients/planning_queries.py','dp_lookup/core/area_assessment.py','dp_lookup/core/models.py','dp_lookup/core/topology.py','dp_lookup/exporters/contracts.py','dp_lookup/exporters/templates/html_map.html','dp_lookup/exporters/templates/dossier.css','dp_lookup/exporters/templates/dossier.js','dp_lookup/py.typed'};
          assert required <= n, required-n"
      - name: Install the wheel into a clean environment
        run: |
          uv python install 3.15
          uv venv --python 3.15 "$RUNNER_TEMP/dp-lookup-clean-venv"
          uv pip install --python "$RUNNER_TEMP/dp-lookup-clean-venv/bin/python" dist/*.whl
          "$RUNNER_TEMP/dp-lookup-clean-venv/bin/dp-lookup-pro" --help
          "$RUNNER_TEMP/dp-lookup-clean-venv/bin/dp-lookup-pro" --version
          "$RUNNER_TEMP/dp-lookup-clean-venv/bin/python" -c "import dp_lookup; from dp_lookup.application.lookup_service import lookup_plot_pro; assert dp_lookup.lookup_plot_pro is lookup_plot_pro; assert dp_lookup.__version__ == '3.14.0'"
      - name: Retain distributions for this run
        uses: actions/upload-artifact@v7
        with:
          name: dp-lookup-dist-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Report every failing version, not just the first.
      fail-fast: false
      matrix:
        # Oldest supported (requires-python = ">=3.11") through current.
        # The whole suite is offline, so it never touches the MCGM servers.
        python-version: ["3.11", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          version: "0.13.5"

      - run: uv python install ${{ matrix.python-version }}

      - run: uv lock --check

      - name: Install project and dev extras
        run: uv sync --frozen --all-extras --dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -q

      - name: Verify the CLI help and version
        run: |
          uv run --python ${{ matrix.python-version }} dp-lookup-pro --help | grep -q "Usage:"
          uv run --python ${{ matrix.python-version }} dp-lookup-pro --version | grep -q "3.14.0"

      - name: Verify the village list is intact
        run: |
          uv run --python ${{ matrix.python-version }} python dp-lookup-pro --list-villages \
            | grep -q "128 valid MCGM village names"
